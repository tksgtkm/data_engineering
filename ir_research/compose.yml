services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: local_dev_only_change_me
      POSTGRES_DB: searchbench
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d searchbench"]
      interval: 5s
      timeout: 5s
      retries: 15

  opensearch:
    build:
      context: ./opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

volumes:
  pgdata:
  osdata:
