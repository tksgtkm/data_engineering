# 顧客・商品のディメンション用セマンティックモデル。
# orders / order_items から entity（customer / product）経由で MetricFlow が自動 join する。
semantic_models:
  - name: customers
    description: 顧客
    model: ref('dim_customers')
    defaults:
      agg_time_dimension: signed_up_at

    entities:
      - name: customer
        type: primary
        expr: customer_id

    dimensions:
      - name: region
        type: categorical
      - name: segment
        type: categorical
      - name: customer_tier
        type: categorical
      - name: signed_up_at
        type: time
        type_params:
          time_granularity: day

    measures:
      - name: customers
        description: 顧客数（登録日基準）
        agg: count_distinct
        expr: customer_id
        create_metric: true

  - name: products
    description: 商品
    model: ref('dim_products')

    entities:
      - name: product
        type: primary
        expr: product_id

    dimensions:
      - name: category
        type: categorical
      - name: product_name
        type: categorical