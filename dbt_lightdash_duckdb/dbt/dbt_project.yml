name: shop_analytics
version: "1.0.0"
config-version: 2

profile: shop_analytics

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

seeds:
  shop_analytics:
    +schema: raw
    raw_orders:
      +column_types:
        order_date: date
    raw_customers:
      +column_types:
        signup_date: date
    raw_order_items:
      +column_types:
        discount_rate: numeric(4, 2)

models:
  shop_analytics:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
      +tags: [bi]        # Lightdash に出すモデル（lightdash deploy -s tag:bi）
    utils:
      +materialized: table
      +schema: utils
